# Handlers run after the stack role, so the containers exist by then.
- name: Reload prometheus
  ansible.builtin.command: docker compose kill -s HUP prometheus
  args:
    chdir: "{{ stack_dir }}"
  changed_when: true

- name: Reload alertmanager
  ansible.builtin.command: docker compose kill -s HUP alertmanager
  args:
    chdir: "{{ stack_dir }}"
  changed_when: true

# Environment files are read only when a container is created.
- name: Recreate grafana
  ansible.builtin.command: docker compose up -d --force-recreate grafana
  args:
    chdir: "{{ stack_dir }}"
  changed_when: true

- name: Restart grafana
  ansible.builtin.command: docker compose restart grafana
  args:
    chdir: "{{ stack_dir }}"
  changed_when: true

# Managed by Ansible. sshd keeps the first value it reads, so this file (10-)
# wins over the cloud image's 60-cloudimg-settings.conf.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
AllowUsers ubuntu
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no

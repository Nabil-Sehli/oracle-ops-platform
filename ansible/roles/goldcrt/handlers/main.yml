# Handlers run after the stack role, so the container exists by then.
# The script is bind-mounted, so a restart is enough to pick up new code.
- name: Restart goldcrt
  ansible.builtin.command: docker compose restart goldcrt
  args:
    chdir: "{{ stack_dir }}"
  changed_when: true

# Environment files are read only when a container is created.
- name: Recreate goldcrt
  ansible.builtin.command: docker compose up -d --force-recreate goldcrt
  args:
    chdir: "{{ stack_dir }}"
  changed_when: true
